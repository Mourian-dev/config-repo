server:
  port: 8086

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow_fraud
    username: postgres
    password:
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
        temperature: 0.3
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        table-name: fraud_patterns
        initialize-schema: true
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE