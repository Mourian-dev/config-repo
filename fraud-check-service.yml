server:
  port: 8086

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow_fraud
    username: postgres
    password:
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        table-name: fraud_patterns
        initialize-schema: true
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE