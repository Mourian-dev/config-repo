server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/orderflow_payments
    username: root
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    producer:
      properties:
        spring.json.type.mapping: "paymentRefunded:com.orderflow.payment.event.PaymentRefundedEvent"
    consumer:
      properties:
        spring.json.type.mapping: "orderCancelled:com.orderflow.payment.event.OrderCancelledEvent"