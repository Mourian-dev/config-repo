server:
  port: 8082

spring:
  cassandra:
    keyspace-name: orderflow_inventory
    contact-points: localhost
    port: 9042
    local-datacenter: datacenter1
    schema-action: create_if_not_exists
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    producer:
      properties:
        spring.json.type.mapping: "stockReleased:com.orderflow.inventory.event.StockReleasedEvent"
    consumer:
      properties:
        spring.json.type.mapping: "orderCancelled:com.orderflow.inventory.event.OrderCancelledEvent"