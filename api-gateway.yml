server:
  port: 8080
spring:
  cloud:
    gateway:
      routes:
        - id: create-order-saga
          uri: lb://create-order-saga
          predicates:
            - Path=/orders
            - Method=POST
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/inventory/**

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/