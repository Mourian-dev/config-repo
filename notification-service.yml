server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/orderflow_notifications
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    consumer:
      properties:
        spring.json.type.mapping: "stockReleased:com.orderflow.notification.event.StockReleasedEvent, paymentRefunded:com.orderflow.notification.event.PaymentRefundedEvent"
